name: Docker Build

on:
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Mint mgs-import read token
        id: mgs_import_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.IMPORT_READER_APP_ID }}
          private-key: ${{ secrets.IMPORT_READER_PRIVATE_KEY }}
          owner: securebio
          repositories: nao-mgs-import

      - name: Debug — verify token can read nao-mgs-import (REMOVE)
        env:
          GH_APP_TOKEN: ${{ steps.mgs_import_token.outputs.token }}
        run: |
          echo "Token length: ${#GH_APP_TOKEN}"
          http_code=$(curl -s -o /tmp/api_resp -w "%{http_code}" \
            -H "Authorization: token $GH_APP_TOKEN" \
            https://api.github.com/repos/securebio/nao-mgs-import)
          echo "HTTP $http_code"
          head -c 400 /tmp/api_resp; echo
          echo "---"
          contents_code=$(curl -s -o /tmp/contents_resp -w "%{http_code}" \
            -H "Authorization: token $GH_APP_TOKEN" \
            https://api.github.com/repos/securebio/nao-mgs-import/contents/README.md)
          echo "contents/README.md → HTTP $contents_code"
          head -c 200 /tmp/contents_resp; echo

      - name: Build Docker image
        env:
          GH_APP_TOKEN: ${{ steps.mgs_import_token.outputs.token }}
        run: |
          docker build \
            --secret id=gh_token,env=GH_APP_TOKEN \
            -t basecall-workflow-test .

      - name: Smoke test - nextflow available
        run: >
          docker run --rm --entrypoint /usr/local/bin/_entrypoint.sh
          basecall-workflow-test nextflow -version

      - name: Smoke test - workflow files baked in
        run: >
          docker run --rm --entrypoint bash basecall-workflow-test
          -c "test -f /workflow/main.nf && test -d /workflow/modules && test -d /workflow/configs && echo OK"

      - name: Smoke test - awscli available
        run: >
          docker run --rm --entrypoint /usr/local/bin/_entrypoint.sh
          basecall-workflow-test aws --version

      - name: Smoke test - main.nf parses
        run: >
          docker run --rm --entrypoint /usr/local/bin/_entrypoint.sh
          basecall-workflow-test bash -c "cd /tmp && nextflow config /workflow/main.nf > /dev/null"
